plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = versions.sourceCompatibility
    targetCompatibility = versions.targetCompatibility
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(versions.jvmTarget)
    }
}

dependencies {
    // Retrofit，需要下传依赖
    api "com.squareup.retrofit2:retrofit:2.9.0"
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    // 解析 HTML
    implementation 'org.jsoup:jsoup:1.15.4'

    // 处理 iCal 格式的日历文件
    implementation("org.mnode.ical4j:ical4j:3.2.11") {
        // exclude modules which are in conflict with system libraries
        exclude group: 'commons-logging'
        exclude group: 'org.json', module: 'json'
        // exclude groovy because we don't need it
        exclude group: 'org.codehaus.groovy', module: 'groovy'
        exclude group: 'org.codehaus.groovy', module: 'groovy-dateutil'
    }

    api 'com.github.BIT101-dev.BIT-Login:bit-login:v4.0.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.14.5'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
}
